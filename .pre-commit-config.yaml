repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        always_run: true
      - id: end-of-file-fixer
        always_run: true
      - id: check-added-large-files
        always_run: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: terraform-fmt
        name: Terraform fmt
        entry: terraform fmt -recursive
        language: system
        pass_filenames: false
        always_run: true

      - id: terraform-validate
        name: Terraform validate
        entry: terraform validate
        language: system
        pass_filenames: false
        always_run: true

      - id: terraform-naming
        name: Check Terraform naming (snake_case)
        entry: python .pre-commit-hooks/check-terraform-naming.py
        language: system
        files: \.tf$
        pass_filenames: true
        always_run: true

      - id: terraform-comments
        name: Check Terraform comments (use `#` not `//` or `/* */`)
        entry: python .pre-commit-hooks/check-terraform-comments.py
        language: system
        files: \.tf$
        types: [terraform]
        pass_filenames: true
        always_run: true
