# Configurazione di esempio per testare gli hooks localmente
# Gli utenti finali NON useranno questo file, ma lo creeranno nei loro progetti

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Test locale degli hooks di questa repository
  - repo: local
    hooks:
      - id: terraform-naming
        name: Check Terraform naming (snake_case)
        entry: python hooks/check-terraform-naming.py
        language: system
        files: \.tf$
        pass_filenames: true

      - id: terraform-comments
        name: Check Terraform comments (use # not // or /* */)
        entry: python hooks/check-terraform-comments.py
        language: system
        files: \.tf$
        pass_filenames: true
